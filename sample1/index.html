document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-spacing:0.44em;color:rgba(240,236,228,.82);pointer-events:none;\">結婚式のご案内<\u002Fdiv>\n    <div style=\"position:absolute;left:30px;right:30px;bottom:74px;pointer-events:none;\">\n      <div style=\"font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.42em;color:#e6c98a;margin-bottom:18px;\">SHINAGAWA PRINCE HOTEL<\u002Fdiv>\n      <div style=\"font-family:'Cormorant Garamond',serif;font-size:64px;line-height:.92;font-weight:300;color:#fff;letter-spacing:0.01em;\">2026<span style=\"color:#e6c98a;\">.<\u002Fspan>12<span style=\"color:#e6c98a;\">.<\u002Fspan>12<\u002Fdiv>\n      <div style=\"height:1px;background:linear-gradient(90deg,#e6c98a,rgba(230,201,138,0));margin:22px 0 20px;transform-origin:left;animation:wipe 1.6s .3s cubic-bezier(.2,.7,.2,1) both;\"><\u002Fdiv>\n      <div style=\"font-family:'Shippori Mincho B1',serif;font-size:23px;letter-spacing:0.12em;color:#fff;\">山口 海斗<span style=\"color:#e6c98a;font-size:15px;margin:0 10px;\">&amp;<\u002Fspan>門脇 静香<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:absolute;left:0;right:0;bottom:26px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:0.4em;color:#f0ece4;animation:cue 2.4s ease-in-out infinite;pointer-events:none;\">SCROLL<\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{showCountdown}}\" hint-placeholder-val=\"{{true}}\">\n    <div style=\"display:flex;justify-content:center;gap:22px;padding:26px 20px;border-top:1px solid rgba(230,201,138,.22);border-bottom:1px solid rgba(230,201,138,.22);background:linear-gradient(180deg,rgba(230,201,138,.05),rgba(230,201,138,0));\">\n      <sc-for list=\"{{countdown}}\" as=\"unit\" hint-placeholder-count=\"4\">\n        <div style=\"text-align:center;min-width:52px;\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-size:30px;line-height:1;color:#fff;font-weight:300;\">{{unit.value}}<\u002Fdiv>\n          <div style=\"font-size:9.5px;letter-spacing:0.24em;color:rgba(240,236,228,.5);margin-top:8px;\">{{unit.label}}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"padding:74px 34px 60px;text-align:center;animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 26%;\">\n    <div style=\"font-family:'Cormorant Garamond',serif;font-size:10.5px;letter-spacing:0.42em;color:#e6c98a;margin-bottom:30px;\">INVITATION<\u002Fdiv>\n    <p style=\"font-family:'Shippori Mincho B1',serif;font-size:15px;color:rgba(240,236,228,.86);margin:0;\">謹啓　皆さまいかがお過ごしでしょうか<\u002Fp>\n    <p style=\"font-family:'Shippori Mincho B1',serif;font-size:15px;color:rgba(240,236,228,.86);margin:0 0 22px;\">このたび　私たちは結婚式を挙げることになりました<\u002Fp>\n    <p style=\"font-family:'Shippori Mincho B1',serif;font-size:15px;color:rgba(240,236,228,.86);margin:0;\">つきましては　日頃の感謝をお伝えしたく<\u002Fp>\n    <p style=\"font-family:'Shippori Mincho B1',serif;font-size:15px;color:rgba(240,236,228,.86);margin:0 0 22px;\">ささやかな披露の席を設けました<\u002Fp>\n    <p style=\"font-family:'Shippori Mincho B1',serif;font-size:15px;color:rgba(240,236,228,.86);margin:0;\">ご多用中誠に恐縮に存じますが<\u002Fp>\n    <p style=\"font-family:'Shippori Mincho B1',serif;font-size:15px;color:rgba(240,236,228,.86);margin:0 0 26px;\">ぜひご出席いただきたくご案内申し上げます<\u002Fp>\n    <p style=\"font-family:'Shippori Mincho B1',serif;font-size:13px;letter-spacing:0.2em;color:rgba(240,236,228,.5);margin:0;\">謹白　令和八年十二月吉日<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 30px 20px;animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 24%;\">\n    <div style=\"font-family:'Cormorant Garamond',serif;font-size:10.5px;letter-spacing:0.42em;color:#e6c98a;margin-bottom:26px;text-align:center;\">THE DAY<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;\">\n      <sc-for list=\"{{timeline}}\" as=\"row\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid;grid-template-columns:70px 1px 1fr;gap:18px;\">\n          <div style=\"text-align:right;font-family:'Cormorant Garamond',serif;font-size:21px;line-height:1.1;color:#fff;padding-top:2px;font-weight:300;\">{{row.time}}<\u002Fdiv>\n          <div style=\"background:linear-gradient(180deg,rgba(230,201,138,.5),rgba(230,201,138,.12));position:relative;\">\n            <div style=\"position:absolute;top:8px;left:-3px;width:7px;height:7px;border-radius:50%;background:#e6c98a;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding-bottom:30px;\">\n            <div style=\"font-family:'Shippori Mincho B1',serif;font-size:15.5px;color:#fff;letter-spacing:0.08em;\">{{row.title}}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:rgba(240,236,228,.52);line-height:1.8;\">{{row.note}}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:34px 24px 60px;\">\n    <div style=\"display:flex;gap:0;border:1px solid rgba(230,201,138,.3);border-radius:999px;overflow:hidden;margin-bottom:22px;\">\n      <button sc-camel-on-click=\"{{selectFamily}}\" style=\"{{familyTabStyle}}\">ご親族の皆さま<\u002Fbutton>\n      <button sc-camel-on-click=\"{{selectGuest}}\" style=\"{{guestTabStyle}}\">ご来賓の皆さま<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.07);padding:30px 26px;\">\n      <div style=\"font-family:'Shippori Mincho B1',serif;font-size:14px;letter-spacing:0.1em;color:#e6c98a;margin-bottom:16px;\">{{noticeTitle}}<\u002Fdiv>\n      <p style=\"font-family:'Shippori Mincho B1',serif;font-size:14px;color:rgba(240,236,228,.85);margin:0;white-space:pre-line;\">{{noticeBody}}<\u002Fp>\n      <div style=\"margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(240,236,228,.5);white-space:pre-line;\">{{noticeFoot}}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 0 64px;animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 22%;\">\n    <div style=\"padding:0 30px;text-align:center;\">\n      <div style=\"font-family:'Cormorant Garamond',serif;font-size:10.5px;letter-spacing:0.42em;color:#e6c98a;margin-bottom:22px;\">VENUE<\u002Fdiv>\n      <div style=\"font-family:'Shippori Mincho B1',serif;font-size:21px;color:#fff;letter-spacing:0.1em;\">品川プリンスホテル<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:rgba(240,236,228,.5);margin:6px 0 24px;\">東京都港区高輪4-10-30 ／ メインタワー<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px;\">\n        <a href=\"https://www.princehotels.co.jp/shinagawa/\" target=\"_blank\" rel=\"noopener\" style=\"border:1px solid rgba(230,201,138,.4);padding:13px 0;font-size:12px;letter-spacing:0.08em;text-align:center;\">ホテルTOP<\u002Fa>\n        <a href=\"https://www.princehotels.co.jp/shinagawa/access/\" target=\"_blank\" rel=\"noopener\" style=\"border:1px solid rgba(230,201,138,.4);padding:13px 0;font-size:12px;letter-spacing:0.08em;text-align:center;\">アクセス・交通<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{showMap}}\" hint-placeholder-val=\"{{true}}\">\n      <div style=\"width:100%;aspect-ratio:5/4;overflow:hidden;filter:grayscale(1) invert(.92) hue-rotate(180deg) contrast(.9);\">\n        <iframe src=\"https://maps.google.com/maps?q=品川プリンスホテル&amp;output=embed\" style=\"width:100%;height:100%;border:0;\" loading=\"lazy\"><\u002Fiframe>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 30px 70px;\">\n    <div style=\"font-family:'Cormorant Garamond',serif;font-size:10.5px;letter-spacing:0.42em;color:#e6c98a;margin-bottom:30px;text-align:center;\">MESSAGE<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:112px 1fr;gap:18px;align-items:end;margin-bottom:38px;animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 24%;\">\n      <div style=\"width:112px;height:150px;\">\n        <image-slot id=\"v2-groom\" shape=\"rect\" placeholder=\"新郎\" src=\"cfeb7e9f-29a0-494f-b859-4185512f6eb7\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.3em;color:#e6c98a;\">GROOM<\u002Fdiv>\n        <div style=\"font-family:'Shippori Mincho B1',serif;font-size:17px;color:#fff;margin-bottom:10px;\">山口 海斗<\u002Fdiv>\n        <p style=\"font-size:12.5px;color:rgba(240,236,228,.68);margin:0;line-height:1.9;\">支えてくださった皆さまへ感謝を込めて　これからも静香さんと共に温かい家庭を築いてまいります<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 112px;gap:18px;align-items:end;animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 24%;\">\n      <div style=\"text-align:right;\">\n        <div style=\"font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.3em;color:#e6c98a;\">BRIDE<\u002Fdiv>\n        <div style=\"font-family:'Shippori Mincho B1',serif;font-size:17px;color:#fff;margin-bottom:10px;\">門脇 静香<\u002Fdiv>\n        <p style=\"font-size:12.5px;color:rgba(240,236,228,.68);margin:0;line-height:1.9;\">たくさんのご縁に恵まれて今日を迎えました　変わらぬお付き合いをお願いいたします<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"width:112px;height:150px;\">\n        <image-slot id=\"v2-bride\" shape=\"rect\" placeholder=\"新婦\" src=\"71bcdc9f-87a7-4d61-b388-9f745b22e841\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 24px 70px;\">\n    <div style=\"font-family:'Cormorant Garamond',serif;font-size:10.5px;letter-spacing:0.42em;color:#e6c98a;margin-bottom:22px;text-align:center;\">INFORMATION<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;\">\n      <a href=\"https://www.princehotels.co.jp/wedding/allergy_info/\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 6px;border-top:1px solid rgba(255,255,255,.09);font-size:13px;color:#f0ece4;\">食物アレルギーへの対応について<span style=\"color:#e6c98a;\">→<\u002Fspan><\u002Fa>\n      <a href=\"https://www.princehotels.co.jp/shinagawa/wedding/faq.html\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 6px;border-top:1px solid rgba(255,255,255,.09);font-size:13px;color:#f0ece4;\">列席者美容・よくあるご質問<span style=\"color:#e6c98a;\">→<\u002Fspan><\u002Fa>\n      <a href=\"https://www.princehotels.co.jp/shinagawa/access/\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 6px;border-top:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.09);font-size:13px;color:#f0ece4;\">駐車場・宿泊のご案内<span style=\"color:#e6c98a;\">→<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 30px 40px;text-align:center;\">\n    <div style=\"font-family:'Cormorant Garamond',serif;font-size:10.5px;letter-spacing:0.42em;color:#e6c98a;margin-bottom:20px;\">RSVP<\u002Fdiv>\n    <p style=\"font-family:'Shippori Mincho B1',serif;font-size:14.5px;color:rgba(240,236,228,.85);margin:0 0 26px;\">お手数ではございますが<br>ご出欠のお返事を <span style=\"color:#e6c98a;\">11月10日<\u002Fspan> までに<br>いただけますと幸いです<\u002Fp>\n    <a href=\"#rsvp\" style=\"display:block;background:#e6c98a;color:#14150f;padding:17px 0;font-size:13.5px;letter-spacing:0.14em;font-weight:500;\">出欠の回答をする<\u002Fa>\n  <\u002Fdiv>\n\n  <div style=\"padding:44px 0 120px;text-align:center;border-top:1px solid rgba(255,255,255,.08);\">\n    <div style=\"font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.36em;color:rgba(240,236,228,.45);\">KAITO &amp; SHIZUKA — 12.12.2026<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none;\">\n    <div style=\"width:100%;max-width:480px;display:flex;align-items:center;gap:14px;padding:12px 16px;background:rgba(13,14,16,.82);backdrop-filter:blur(14px);border-top:1px solid rgba(230,201,138,.25);pointer-events:auto;\">\n      <div style=\"flex:1;\">\n        <div style=\"font-size:10px;letter-spacing:0.2em;color:rgba(240,236,228,.5);\">回答期限 11月10日<\u002Fdiv>\n        <div style=\"font-family:'Shippori Mincho B1',serif;font-size:13px;color:#fff;\">{{stickyLine}}<\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"#rsvp\" style=\"background:#e6c98a;color:#14150f;padding:12px 22px;font-size:12.5px;letter-spacing:0.1em;font-weight:500;white-space:nowrap;\">回答する<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:900},&quot;showCountdown&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showMap&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { audience: 'family', now: Date.now() };\n\n  componentDidMount() {\n    this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  renderVals() {\n    const target = new Date('2026-12-12T16:45:00+09:00').getTime();\n    const diff = Math.max(0, target - this.state.now);\n    const s = Math.floor(diff / 1000);\n    const countdown = [\n      { label: 'DAYS', value: Math.floor(s / 86400) },\n      { label: 'HOURS', value: String(Math.floor(s / 3600) % 24).padStart(2, '0') },\n      { label: 'MIN', value: String(Math.floor(s / 60) % 60).padStart(2, '0') },\n      { label: 'SEC', value: String(s % 60).padStart(2, '0') },\n    ];\n\n    const isFamily = this.state.audience === 'family';\n    const tab = (active) => 'flex:1;border:0;background:' + (active ? '#e6c98a' : 'transparent')\n      + ';color:' + (active ? '#14150f' : 'rgba(240,236,228,.72)')\n      + \";padding:13px 0;font-size:12.5px;letter-spacing:0.08em;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:background .25s ease,color .25s ease;\";\n\n    return {\n      countdown,\n      showCountdown: this.props.showCountdown ?? true,\n      showMap: this.props.showMap ?? true,\n      timeline: [\n        { time: '15:55', title: '親族控室 集合', note: 'メインタワー3階　お荷物は2階クロークへ' },\n        { time: '16:25', title: 'ご来賓 挙式列席者控室', note: '挙式20分前までにメインタワー3階へ' },\n        { time: '16:45', title: '挙式', note: '〜 17:45' },\n        { time: '17:30', title: '披露宴からの方 受付', note: 'メインタワー来賓控室' },\n        { time: '18:00', title: '披露宴', note: '〜 20:30 お開き' },\n      ],\n      selectFamily: () => this.setState({ audience: 'family' }),\n      selectGuest: () => this.setState({ audience: 'guest' }),\n      familyTabStyle: tab(isFamily),\n      guestTabStyle: tab(!isFamily),\n      noticeTitle: isFamily ? '結婚式のご案内（ご親族の皆さま）' : '結婚式のご案内（ご来賓の皆さま）',\n      noticeBody: isFamily\n        ? 'ご多用中恐縮に存じますが\\n16時45分からの結婚式にご列席賜りたく\\n15時55分までにメインタワー3階親族控室へ\\nご来駕のほどお願い申しあげます'\n        : 'ご多用中恐縮に存じますが\\n16時45分からの結婚式にご列席賜りたく\\n挙式20分前までにメインタワー3階挙式列席者控室へ\\nご来駕のほどお願い申しあげます',\n      noticeFoot: isFamily\n        ? '※お荷物は2階クロークへお預けください'\n        : '※お荷物は2階クロークへお預けください\\n※ご披露宴からお越しの方は17時30分までにメインタワー来賓控室までご来駕のほどお願い申しあげます',\n      stickyLine: isFamily ? '15:55 メインタワー3階 親族控室' : '16:25 メインタワー3階 挙式列席者控室',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
